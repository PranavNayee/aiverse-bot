name: Daily cartoon reel
on:
  schedule:
    - cron: "30 2 * * *"      # 08:00 AM IST (GitHub can delay scheduled runs by up to ~30 min)
  workflow_dispatch:
concurrency:
  group: cartoon-daily
  cancel-in-progress: false
permissions:
  contents: write              # only used for the monthly keep-alive commit
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-color-emoji
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-depth-v1
      - name: Self-test video engine (no internet needed)
        run: python tests/offline_test.py
      - name: Make the reel
        run: python src/main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          REVIEW_MODE: ${{ vars.REVIEW_MODE || 'approve' }}
          REVIEW_HOURS: ${{ vars.REVIEW_HOURS || '2' }}
          MOUTH_FX: ${{ vars.MOUTH_FX || 'true' }}
      - name: Keep-alive (GitHub pauses schedules on repos with no activity for 60 days)
        if: always()
        run: |
          if [ "$(date +%d)" = "01" ]; then
            date > .keepalive
            git config user.name "github-actions"; git config user.email "actions@github.com"
            git add .keepalive; git commit -m "keepalive" || true; git push || true
          fi
