name: Daily cartoon reel
# Makes tomorrow's reel the NIGHT BEFORE and queues it for 08:00 IST (POST_TIME).
# GitHub cron is often hours late or skipped, so there are several backup triggers; every run after the
# first sees the reel is already made/posted and exits in seconds. Runs that start <5.5 h before the slot
# also stay alive and publish exactly on time (the 'Post approved reel' workflow does the same).
on:
  schedule:
    - cron: "47 14 * * *"   # 20:17 IST  (main run: makes tomorrow's reel)
    - cron: "23 17 * * *"   # 22:53 IST  (backup)
    - cron: "11 21 * * *"   # 02:41 IST  (backup, waits and posts at 08:00)
    - cron: "53 23 * * *"   # 05:23 IST  (last backup, waits and posts at 08:00)
  workflow_dispatch:
    inputs:
      post_now:
        description: "Make a reel and post it RIGHT NOW (ignores the 08:00 slot)"
        type: boolean
        default: false
      force_new:
        description: "Re-make the next slot's reel even if one is already queued"
        type: boolean
        default: false
      content:
        description: "What to make"
        type: choice
        options: [auto, lesson, fun_fact]
        default: auto
      fresh_start:
        description: "Restart the series at Lesson #1 (backs up and clears history + stats)"
        type: boolean
        default: false
      strict_voice:
        description: "Require the human-like voice (fail instead of using the robotic Edge voice)"
        type: boolean
        default: true
permissions:
  contents: read
  actions: write          # lets the job keep the schedules enabled (GitHub disables them after 60 idle days)
concurrency:
  group: reel-generate
  cancel-in-progress: false
jobs:
  make-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cartoon-bot/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/media
          key: media-v1
      - name: Install ffmpeg + fonts (no apt mirror needed)
        timeout-minutes: 12
        run: bash .github/setup-media.sh
      - run: pip install -r cartoon-bot/requirements.txt
      - name: Keep schedules alive
        continue-on-error: true
        run: gh workflow enable daily.yml && gh workflow enable post.yml && gh workflow enable engage.yml
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python cartoon-bot/src/lesson_main.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          REVIEW_MODE: ${{ vars.REVIEW_MODE || 'approve' }}
          REVIEW_HOURS: ${{ vars.REVIEW_HOURS || '2' }}
          POST_TIME: ${{ vars.POST_TIME || '08:00' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Kolkata' }}
          LANGUAGE_MODE: ${{ vars.LANGUAGE_MODE || 'hinglish' }}
          MASCOT: ${{ vars.MASCOT || 'true' }}
          MUSIC: ${{ vars.MUSIC || 'true' }}
          VOICE_NAME: ${{ vars.VOICE_NAME || 'hi-IN-MadhurNeural' }}
          VOICE_PITCH: ${{ vars.VOICE_PITCH || '-6Hz' }}
          VOICE_RATE: ${{ vars.VOICE_RATE || '-3%' }}
          VOICE_FX: ${{ vars.VOICE_FX || 'true' }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER || 'auto' }}
          GEMINI_VOICE: ${{ vars.GEMINI_VOICE || 'Charon' }}
          GEMINI_SPEAK_DEVANAGARI: ${{ vars.GEMINI_SPEAK_DEVANAGARI || 'false' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SERIES_NAME: ${{ vars.SERIES_NAME || 'AIVerse' }}
          POST_NOW: ${{ inputs.post_now || 'false' }}
          FORCE_NEW: ${{ inputs.force_new || 'false' }}
          STRICT_VOICE: ${{ inputs.strict_voice || 'false' }}
          CONTENT_TYPE: ${{ inputs.content || 'auto' }}
          FRESH_START: ${{ inputs.fresh_start || 'false' }}
          PYTHONPATH: cartoon-bot/src
