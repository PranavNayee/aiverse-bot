name: Post approved reel
# Light job (no rendering): publishes the queued reel at its slot time. Runs every 20 min because GitHub
# skips many scheduled runs; a run that starts within 5.5 h of the slot sleeps and posts exactly on time.
# Duplicate posts are impossible: a storage lock + a check of the account's latest posts.
on:
  schedule:
    - cron: "4,24,44 * * * *"
  workflow_dispatch:
    inputs:
      force_post:
        description: "Post the queued reel NOW (ignores the slot time, approval and retry limit)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: reel-post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cartoon-bot/requirements.txt
      - run: pip install requests
      - run: python cartoon-bot/src/post_pending.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          REVIEW_MODE: ${{ vars.REVIEW_MODE || 'approve' }}
          REVIEW_HOURS: ${{ vars.REVIEW_HOURS || '2' }}
          POST_TIME: ${{ vars.POST_TIME || '08:00' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Kolkata' }}
          FORCE_POST: ${{ inputs.force_post || 'false' }}
          PYTHONPATH: cartoon-bot/src
