name: Pre-flight check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["cartoon-bot/**", ".github/workflows/**"]
jobs:
  offline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cartoon-bot/requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-color-emoji
      - run: pip install -r cartoon-bot/requirements.txt
      - run: python cartoon-bot/tests/offline_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sample-reel
          path: test_work/reel.mp4
          if-no-files-found: ignore
  services:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cartoon-bot/requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-color-emoji
      - run: pip install -r cartoon-bot/requirements.txt
      - run: python cartoon-bot/src/check.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          REVIEW_MODE: ${{ vars.REVIEW_MODE || 'approve' }}
          POST_TIME: ${{ vars.POST_TIME || '08:00' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Kolkata' }}
          PYTHONPATH: cartoon-bot/src
