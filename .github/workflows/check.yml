name: Pre-flight check
on:
  workflow_dispatch:
    inputs:
      ig_admin:
        description: "Instagram admin command, e.g. 'post-lesson 1'"
        type: string
        default: ""
      yt_admin:
        description: "YouTube admin command, e.g. 'delete ID1 ID2' or 'post-lesson 1'"
        type: string
        default: ""
      youtube_test:
        description: "Upload the sample reel to the connected YouTube channel as PRIVATE"
        type: boolean
        default: false
      voice_samples:
        description: "Also render voice samples (all voices, Hinglish + English) as a downloadable artifact"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["cartoon-bot/**", ".github/workflows/**"]
jobs:
  offline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cartoon-bot/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/media
          key: media-v1
      - name: Install ffmpeg + fonts (no apt mirror needed)
        timeout-minutes: 12
        run: bash .github/setup-media.sh
      - run: pip install -r cartoon-bot/requirements.txt
      - run: python cartoon-bot/tests/offline_test.py
      - name: Instagram admin
        if: github.event_name == 'workflow_dispatch' && inputs.ig_admin != ''
        run: python cartoon-bot/tools/ig_admin.py ${{ inputs.ig_admin }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          PYTHONPATH: cartoon-bot/src
      - name: YouTube admin
        if: github.event_name == 'workflow_dispatch' && inputs.yt_admin != ''
        run: python cartoon-bot/tools/yt_admin.py ${{ inputs.yt_admin }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          LANGUAGE_MODE: ${{ vars.LANGUAGE_MODE || 'hinglish' }}
          PYTHONPATH: cartoon-bot/src
      - name: YouTube test upload (private)
        if: github.event_name == 'workflow_dispatch' && inputs.youtube_test
        run: python cartoon-bot/tools/yt_upload_check.py
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          LANGUAGE_MODE: ${{ vars.LANGUAGE_MODE || 'hinglish' }}
          PYTHONPATH: cartoon-bot/src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sample-reel
          path: test_work/reel.mp4
          if-no-files-found: ignore
  services:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cartoon-bot/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/media
          key: media-v1
      - name: Install ffmpeg + fonts (no apt mirror needed)
        timeout-minutes: 12
        run: bash .github/setup-media.sh
      - run: pip install -r cartoon-bot/requirements.txt
      - run: python cartoon-bot/src/check.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          REVIEW_MODE: ${{ vars.REVIEW_MODE || 'approve' }}
          POST_TIME: ${{ vars.POST_TIME || '08:00' }}
          LANGUAGE_MODE: ${{ vars.LANGUAGE_MODE || 'hinglish' }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER || 'auto' }}
          GEMINI_VOICE: ${{ vars.GEMINI_VOICE || 'Charon' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Kolkata' }}
          PYTHONPATH: cartoon-bot/src
  voice-samples:
    if: github.event_name == 'workflow_dispatch' && inputs.voice_samples
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cartoon-bot/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/media
          key: media-v1
      - name: Install ffmpeg + fonts (no apt mirror needed)
        timeout-minutes: 12
        run: bash .github/setup-media.sh
      - run: pip install -r cartoon-bot/requirements.txt
      - run: python cartoon-bot/tools/voice_samples.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: cartoon-bot/src
      - uses: actions/upload-artifact@v4
        with:
          name: voice-samples
          path: test_work/voices
