name: Weekly long video
# Sunday 20:53 IST: stitches the week's reels into one 16:9 "This Week in AI" YouTube video with chapters.
on:
  schedule:
    - cron: "23 15 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: "Make it even if this week's video already exists"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: reel-weekly
  cancel-in-progress: false
jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cartoon-bot/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/media
          key: media-v1
      - name: Install ffmpeg + fonts (no apt mirror needed)
        timeout-minutes: 12
        run: bash .github/setup-media.sh
      - run: pip install -r cartoon-bot/requirements.txt
      - run: python cartoon-bot/src/weekly.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SERIES_NAME: ${{ vars.SERIES_NAME || 'AIVerse' }}
          LANGUAGE_MODE: ${{ vars.LANGUAGE_MODE || 'hinglish' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Kolkata' }}
          FORCE_WEEKLY: ${{ inputs.force || 'false' }}
          PYTHONPATH: cartoon-bot/src
